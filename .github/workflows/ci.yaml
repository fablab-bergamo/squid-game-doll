name: CI

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # MediaPipe requires EGL and OpenGL ES even for headless CPU inference.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libegl1 libgles2

    # Set up Python
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    # Cache pip dependencies
    - name: Cache pip
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-3.11-pip-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-3.11-pip-

    # Install Poetry
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry==2.5.1 pip-audit==2.10.1

    # Configure Poetry
    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true

    # Cache Poetry virtual environment
    - name: Cache Poetry venv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: ${{ runner.os }}-python-3.11-poetry-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-python-3.11-poetry-

    # Install dependencies
    - name: Install dependencies
      run: |
        poetry check --lock
        poetry sync --extras standard --no-interaction
        poetry run python -m pip check

    - name: Compile Python sources
      run: poetry run python -m compileall -q src tests esp32 optimize_for_jetson.py run_laser_finder_nn_batch.py

    - name: Build package
      run: poetry build

    - name: Audit dependencies
      run: |
        poetry run python -m pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-audit.txt"
        pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements-audit.txt"

    - name: Install built wheel
      run: poetry run python -m pip install --no-deps --force-reinstall dist/*.whl

    # Run tests
    - name: Run tests
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
      run: poetry run pytest
